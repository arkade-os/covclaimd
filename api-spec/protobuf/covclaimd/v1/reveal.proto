syntax = "proto3";
package covclaimd.v1;
option go_package = "github.com/arkade-os/covclaimd/api-spec/protobuf/gen/go/covclaimd/v1";

// RevealService lets a maker reveal a preimage claim directly to covclaimd
// instead of stamping it into the funding transaction's Arkade extension.
// covclaimd remembers the {swap_address, packet} pair, watches the arkd tx
// stream, and claims the moment the swap address is funded.
service RevealService {
  // Reveal registers a claim packet for a swap address. The bot validates the
  // packet against the taptree — the taptree must hash to the swap address and
  // must contain the claim closure for this arkade script and preimage — and
  // rejects anything it cannot bind to the address. Served over HTTP as POST
  // /v1/reveal by the hand-rolled gateway in internal/interface/grpc/server.go.
  rpc Reveal(RevealRequest) returns (RevealResponse) {}
}

// ClaimPacket mirrors the Arkade-extension TLV ClaimPacket: an ECIES ciphertext
// of the 32-byte preimage and the plaintext EnforcePayTo arkade script.
message ClaimPacket {
  bytes ciphertext = 1;
  bytes arkade_script = 2;
}

message RevealRequest {
  // bech32m Arkade address of the VHTLC funding (swap) output.
  string swap_address = 1;
  ClaimPacket packet = 2;
  // Hex-encoded BIP-371 taptree of the funding output.
  string taptree = 3;
}

message RevealResponse {}
