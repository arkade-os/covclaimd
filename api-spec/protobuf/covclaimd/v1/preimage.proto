syntax = "proto3";
package covclaimd.v1;
option go_package = "github.com/arkade-os/covclaimd/api-spec/protobuf/gen/go/covclaimd/v1";

import "google/api/annotations.proto";

// PreimageService exposes the bot's encryption pubkey. Clients ECIES-encrypt
// preimage claim credentials to this key and attach the ciphertext (along with
// the taptree) inside an Ark extension TLV packet (type 0x04). The bot picks
// up the funding tx from the arkd stream and decrypts on the fly — no
// per-claim registration or persistence.
service PreimageService {
  // GetCovclaimdPubKey returns the hex-encoded compressed secp256k1 pubkey
  // (33 bytes / 66 hex chars) that clients must use to encrypt the secret
  // payload.
  rpc GetCovclaimdPubKey(GetCovclaimdPubKeyRequest) returns (GetCovclaimdPubKeyResponse) {
    option (google.api.http) = { get: "/v1/preimage/covclaimd-pubkey" };
  }
}

message GetCovclaimdPubKeyRequest {}
message GetCovclaimdPubKeyResponse {
  // Hex-encoded compressed secp256k1 pubkey (33 bytes / 66 hex chars).
  string covclaimd_pub_key = 1;
  // Hex-encoded compressed secp256k1 pubkey of the bot's emulator.
  // Receivers MUST use this when building VHTLCs whose offline-claim
  // closure is meant to be spent by this bot.
  string emulator_pub_key = 2;
}
